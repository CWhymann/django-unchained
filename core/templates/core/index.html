<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Django Unchained</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0b0907;
        color: #f2e6cc;
      }
      header {
        background: #d62c2c;
        border-bottom: 6px solid #000;
        padding: 20px;
        text-align: center;
      }
      header h1 {
        font-family: Impact, sans-serif;
        font-size: 56px;
        margin: 0;
        text-shadow: 4px 4px 0 #000;
      }
      header p {
        margin: 8px 0 0;
        font-family: "Courier New", monospace;
        font-weight: bold;
      }
      main {
        max-width: 960px;
        margin: 24px auto;
        padding: 0 16px;
      }
      .section {
        font-family: Impact, sans-serif;
        font-size: 24px;
        text-transform: uppercase;
        color: #e8a13a;
        margin: 32px 0 12px;
      }
      .panel {
        background: #16110d;
        border: 4px solid #000;
        box-shadow: 6px 6px 0 #000;
        padding: 16px;
        margin-bottom: 16px;
      }
      .panel h3 {
        margin: 0 0 6px;
        font-family: Impact, sans-serif;
        font-size: 20px;
        text-transform: uppercase;
      }
      .stufe {
        font-size: 11px;
        background: #1b3a5c;
        padding: 2px 6px;
        border: 2px solid #000;
        text-transform: uppercase;
      }
      .text {
        color: #c9b893;
        font-size: 15px;
      }
      button {
        background: #d62c2c;
        color: #fff;
        border: 3px solid #000;
        padding: 8px 14px;
        font-family: Impact, sans-serif;
        font-size: 16px;
        text-transform: uppercase;
        cursor: pointer;
        margin-top: 10px;
        box-shadow: 3px 3px 0 #000;
      }
      pre {
        background: #0b0907;
        border: 2px solid #000;
        padding: 10px;
        white-space: pre-wrap;
        min-height: 24px;
        font-family: Consolas, monospace;
        font-size: 13px;
        color: #f2e6cc;
      }
      pre.err {
        color: #ef5a5a;
      }
      #status {
        font-family: Impact, sans-serif;
        font-size: 18px;
        color: #e8a13a;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>DJANGO UNCHAINED</h1>
      <p>Nicht Django. Nur bessere Models. Und mehr Freiheit.</p>
    </header>
    <main>
      <p id="status">Lade Kurs …</p>
      <div id="kurs"></div>
    </main>

    <script>
      const kursEl = document.getElementById("kurs");
      const statusEl = document.getElementById("status");

      const POST_BODY = { title: "Neuer Post", content: "Test aus der Seite" };

      const DEMOS = {
        "Dummydaten hinzufügen": { url: "/demo/posts/" },
        "HttpResponse mit JSON": { url: "/demo/posts/" },
        JsonResponse: { url: "/demo/posts/" },
        "URL-Parameter": { url: "/demo/posts/1/" },
        "URL-Parameter Reihenfolge beachten": { url: "/demo/posts/latest/" },
        "Slug anwenden": { url: "/demo/posts/first-post/" },
        "redirect und reverse": { url: "/demo/alt/" },
        "Http404 und HttpResponseNotFound": { url: "/demo/404/" },
        "Die erste POST-View": {
          url: "/demo/posts/",
          method: "POST",
          body: POST_BODY,
        },
        "Die erste POST-View testen mit Frontend": {
          url: "/demo/posts/",
          method: "POST",
          body: POST_BODY,
        },
        "GET und POST in einer View": { url: "/demo/posts/" },
        "Basic ClassViews": { url: "/demo/posts/" },
      };

      async function ausfuehren(demo, ausgabe) {
        ausgabe.className = "";
        ausgabe.textContent = "läuft …";
        const opts = { method: demo.method || "GET" };
        if (demo.body) {
          const form = new FormData();
          Object.entries(demo.body).forEach(([k, v]) => form.append(k, v));
          opts.body = form;
        }
        try {
          const res = await fetch(demo.url, opts);
          const text = await res.text();
          const weiter = res.redirected
            ? " (weitergeleitet nach " + res.url + ")"
            : "";
          ausgabe.textContent = "Status " + res.status + weiter + "\n\n" + text;
          if (!res.ok) ausgabe.className = "err";
        } catch (e) {
          ausgabe.className = "err";
          ausgabe.textContent = "Fehler: " + e;
        }
      }

      function render(list) {
        let aktuell = "";
        list.forEach((item) => {
          if (item.section !== aktuell) {
            aktuell = item.section;
            const s = document.createElement("div");
            s.className = "section";
            s.textContent = aktuell;
            kursEl.appendChild(s);
          }
          const panel = document.createElement("div");
          panel.className = "panel";
          panel.innerHTML =
            '<h3></h3><span class="stufe"></span><p class="text"></p>';
          panel.querySelector("h3").textContent = item.title;
          panel.querySelector(".stufe").textContent = item.difficulty;
          panel.querySelector(".text").textContent = item.description;
          const demo = DEMOS[item.title];
          if (demo) {
            const btn = document.createElement("button");
            btn.textContent = "Ausprobieren";
            const ausgabe = document.createElement("pre");
            btn.addEventListener("click", () => ausfuehren(demo, ausgabe));
            panel.append(btn, ausgabe);
          }
          kursEl.appendChild(panel);
        });
        statusEl.textContent = list.length + " Kapitel geladen.";
      }

      fetch("/api/challenges/")
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(render)
        .catch((e) => {
          statusEl.textContent = "API-Fehler: " + e;
          statusEl.style.color = "#ef5a5a";
        });
    </script>
  </body>
</html>
