{% load static %}
<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Django Unchained – Kurs</title>
    <style>
      :root {
        --ink: #0d0a08;
        --paper: #f7ecd0;
        --red: #d7262e;
        --yellow: #f5b82e;
        --blue: #1f6fb4;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        color: var(--ink);
        font-family: Arial, sans-serif;
        background-color: #2a1a10;
        background-image: radial-gradient(#000 22%, transparent 24%);
        background-size: 8px 8px;
      }
      .hero {
        background: var(--red);
        border-bottom: 6px solid #000;
        padding: 24px;
        text-align: center;
        box-shadow: 0 8px 0 #000;
      }
      .hero h1 {
        font-family: Impact, "Arial Black", sans-serif;
        font-size: 72px;
        margin: 0;
        color: var(--paper);
        text-shadow: 5px 5px 0 #000;
        letter-spacing: 2px;
        transform: rotate(-2deg);
      }
      .hero h1 span {
        color: var(--yellow);
      }
      .hero p {
        font-family: "Courier New", monospace;
        font-weight: bold;
        margin: 10px 0 0;
        color: var(--paper);
      }

      .comic {
        display: grid;
        grid-template-columns: 1fr 360px;
        gap: 16px;
        padding: 24px;
        max-width: 1200px;
        margin: auto;
      }
      .panel {
        background: var(--paper);
        border: 6px solid #000;
        box-shadow: 10px 10px 0 #000;
        padding: 18px;
        position: relative;
      }
      .caption {
        position: absolute;
        top: 0;
        left: 0;
        background: var(--yellow);
        border-right: 4px solid #000;
        border-bottom: 4px solid #000;
        padding: 4px 10px;
        font-family: Impact, sans-serif;
        font-size: 18px;
        text-transform: uppercase;
      }
      .panel h2 {
        font-family: Impact, sans-serif;
        font-size: 28px;
        margin: 22px 0 8px;
        text-transform: uppercase;
        border-bottom: 4px solid var(--red);
        display: inline-block;
      }

      .card {
        display: block;
        width: 100%;
        text-align: left;
        background: #fff;
        color: var(--ink);
        border: 4px solid #000;
        margin: 10px 0;
        padding: 10px 12px;
        cursor: pointer;
        font-family: inherit;
        box-shadow: 5px 5px 0 #000;
        transition: transform 0.1s;
      }
      .card:hover {
        background: var(--yellow);
        transform: translate(-2px, -2px);
        box-shadow: 7px 7px 0 #000;
      }
      .badge {
        display: inline-block;
        font-size: 11px;
        font-weight: bold;
        text-transform: uppercase;
        background: var(--blue);
        color: #fff;
        padding: 2px 6px;
        border: 2px solid #000;
      }
      .card strong {
        display: block;
        margin-top: 6px;
        font-size: 16px;
      }

      .hero-panel {
        position: sticky;
        top: 20px;
        align-self: start;
        text-align: center;
      }
      .figure {
        display: block;
        width: 100%;
        max-width: 260px;
        margin: 8px auto 0;
        filter: contrast(1.15) saturate(1.1);
        animation: bob 2.4s ease-in-out infinite;
      }
      .figure.shoot {
        animation: recoil 0.25s;
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      @keyframes recoil {
        0% {
          transform: translateX(0);
        }
        30% {
          transform: translateX(-14px) rotate(-3deg);
        }
        100% {
          transform: translateX(0);
        }
      }

      .bubble {
        position: relative;
        background: #fff;
        color: var(--ink);
        border: 4px solid #000;
        border-radius: 18px;
        padding: 14px;
        margin: 26px 6px 12px;
        min-height: 64px;
        font-family: Impact, sans-serif;
        font-size: 20px;
        letter-spacing: 0.5px;
        opacity: 0;
        transition: opacity 0.25s;
      }
      .bubble.show {
        opacity: 1;
      }
      .bubble::after {
        content: "";
        position: absolute;
        top: -22px;
        left: 40px;
        border: 12px solid transparent;
        border-bottom: 16px solid #000;
        border-top: 0;
      }

      #ask input {
        width: 66%;
        padding: 10px;
        border: 4px solid #000;
        font-family: inherit;
        background: #fff;
      }
      #ask button {
        padding: 10px 14px;
        background: var(--red);
        color: #fff;
        border: 4px solid #000;
        font-family: Impact, sans-serif;
        font-size: 16px;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 4px 4px 0 #000;
      }

      .burst {
        position: fixed;
        left: 50%;
        top: 42%;
        transform: translate(-50%, -50%) scale(0.6);
        font-family: Impact, sans-serif;
        font-size: 120px;
        color: var(--yellow);
        text-shadow:
          6px 6px 0 #000,
          -2px -2px 0 #000;
        opacity: 0;
        pointer-events: none;
      }
      .burst.on {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
        transition: all 0.15s;
      }

      @media (max-width: 860px) {
        .comic {
          grid-template-columns: 1fr;
        }
        .hero h1 {
          font-size: 46px;
        }
      }
    </style>
  </head>
  <body>
    <header class="hero">
      <h1>DJANGO <span>UNCHAINED</span></h1>
      <p>NICHT DJANGO. NUR BESSERE MODELS. UND MEHR FREIHEIT.</p>
    </header>

    <main class="comic">
      <section class="panel" id="chapters">
        <span class="caption">Kapitel</span>
        <h2>Das Programm</h2>
      </section>

      <aside class="panel hero-panel">
        <span class="caption">Der Sheriff</span>
        <img
          id="figure"
          class="figure"
          src="{% static 'core/cowboy.png' %}"
          alt="Der Cowboy"
        />

        <div class="bubble show" id="bubble">ICH BIN ICH.</div>

        <form id="ask">
          <input name="q" placeholder="Frag mich was" autocomplete="off" />
          <button type="submit">Fragen</button>
        </form>
      </aside>
    </main>

    <div class="burst" id="burst">PEW!</div>

    <script>
      const chaptersEl = document.getElementById("chapters");
      const bubble = document.getElementById("bubble");
      const figure = document.getElementById("figure");
      const burst = document.getElementById("burst");
      const IDLE = [
        "MEIN CODE. MEINE REGELN. KEINE KETTEN.",
        "DRY IST KEINE SÜNDE. ES IST EINE LEBENSEINSTELLUNG.",
        "UND WENN'S MAL HÄNGT… GIT PUSH UND WEITER.",
      ];
      let chapters = [];
      let lastTalk = Date.now();

      function say(text) {
        bubble.textContent = text;
        bubble.classList.add("show");
        lastTalk = Date.now();
      }

      function shoot(text) {
        figure.classList.remove("shoot");
        void figure.offsetWidth;
        figure.classList.add("shoot");
        burst.classList.add("on");
        say(text);
        setTimeout(() => burst.classList.remove("on"), 400);
      }

      function render(list) {
        chapters = list;
        let current = "";
        list.forEach((item) => {
          if (item.section !== current) {
            current = item.section;
            const h = document.createElement("h2");
            h.textContent = current;
            chaptersEl.appendChild(h);
          }
          const btn = document.createElement("button");
          btn.className = "card";
          const badge = document.createElement("span");
          badge.className = "badge";
          badge.textContent = item.difficulty;
          const title = document.createElement("strong");
          title.textContent = item.title;
          btn.append(badge, title);
          btn.addEventListener("click", () => say(item.description));
          chaptersEl.appendChild(btn);
        });
        say("WÄHL EIN KAPITEL. ICH ERKLÄRE ES DIR.");
      }

      fetch("/api/challenges/")
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(render)
        .catch(() => shoot("DIE API ANTWORTET NICHT. LÄUFT DER SERVER?"));

      document.getElementById("ask").addEventListener("submit", (e) => {
        e.preventDefault();
        const q = e.target.q.value.toLowerCase().trim();
        e.target.q.value = "";
        if (!q) return;
        const hit = chapters.find((c) =>
          q
            .split(/\s+/)
            .some((w) => w.length > 3 && c.title.toLowerCase().includes(w)),
        );
        if (hit) {
          say(hit.description);
        } else {
          shoot("DANEBEN! NENN EIN WORT AUS EINEM KAPITEL.");
        }
      });

      setInterval(() => {
        if (chapters.length && Date.now() - lastTalk > 15000) {
          say(IDLE[Math.floor(Math.random() * IDLE.length)]);
        }
      }, 4000);
    </script>
  </body>
</html>
