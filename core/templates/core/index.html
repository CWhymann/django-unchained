<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Django Unchained</title>
    <style>
      :root {
        --bg: #0b0d14;
        --card: #161925;
        --card2: #1c2030;
        --border: #2a2f42;
        --text: #e8eaf2;
        --muted: #a0a6bd;
        --accent: #ffd43b;
        --accent2: #4b8bbe;
        --ok: #3ecf8e;
        --err: #ef5a5a;
        --mono: "Consolas", "Menlo", monospace;
      }
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, "Segoe UI", sans-serif;
        background:
          radial-gradient(
            ellipse at top left,
            rgba(75, 139, 190, 0.18),
            transparent 55%
          ),
          radial-gradient(
            ellipse at top right,
            rgba(255, 212, 59, 0.1),
            transparent 50%
          ),
          var(--bg);
        background-attachment: fixed;
        color: var(--text);
        max-width: 860px;
        margin: 0 auto;
        padding: 2rem 1.2rem 5rem;
        line-height: 1.5;
      }
      header {
        background: linear-gradient(135deg, var(--card2), var(--card));
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.6rem 1.8rem;
        margin-bottom: 2rem;
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35);
      }
      h1 {
        font-size: 2rem;
        margin: 0 0 0.3rem;
        letter-spacing: -0.01em;
      }
      h1 .dot1 {
        color: var(--accent2);
      }
      h1 .dot2 {
        color: var(--accent);
      }
      #status {
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 0 1rem;
      }
      .fortschritt {
        display: flex;
        align-items: center;
        gap: 0.9rem;
      }
      .balken-bg {
        flex: 1;
        height: 10px;
        background: #0b0d14;
        border: 1px solid var(--border);
        border-radius: 99px;
        overflow: hidden;
      }
      #balken {
        height: 100%;
        width: 0;
        background: linear-gradient(90deg, var(--accent2), var(--ok));
        border-radius: 99px;
        transition: width 0.4s ease;
      }
      #zaehler {
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--muted);
        white-space: nowrap;
      }

      .kapitel {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        font-size: 1.25rem;
        margin: 2.4rem 0 1.1rem;
        color: var(--accent);
      }
      .kapitel::after {
        content: "";
        flex: 1;
        height: 1px;
        background: linear-gradient(90deg, var(--border), transparent);
      }

      .aufgabe {
        background: var(--card);
        border: 1px solid var(--border);
        border-left: 4px solid var(--accent2);
        border-radius: 14px;
        padding: 1.2rem 1.4rem;
        margin-bottom: 1.2rem;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.3);
        transition:
          border-color 0.25s,
          transform 0.2s;
      }
      .aufgabe:hover {
        transform: translateY(-1px);
      }
      .aufgabe.geloest {
        border-left-color: var(--ok);
      }
      .kopf {
        display: flex;
        align-items: center;
        gap: 0.8rem;
        margin-bottom: 0.6rem;
        cursor: pointer;
      }
      .badge {
        flex: none;
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: var(--accent2);
        color: #0b0d14;
        font-weight: 700;
        font-size: 0.95rem;
      }
      .geloest .badge {
        background: var(--ok);
      }
      h2 {
        flex: 1;
        font-size: 1.1rem;
        margin: 0;
      }
      .stufe {
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .haken {
        display: none;
        color: var(--ok);
        font-weight: 700;
        font-size: 1.2rem;
      }
      .geloest .haken {
        display: block;
      }

      .inhalt {
        display: none;
        margin-top: 0.6rem;
      }
      .aufgabe.offen .inhalt {
        display: block;
      }
      .erklaerung {
        background: #11141f;
        border: 1px solid var(--border);
        border-left: 3px solid var(--accent);
        border-radius: 8px;
        padding: 0.75rem 1rem;
        font-size: 0.9rem;
        color: var(--muted);
        margin-bottom: 1rem;
      }
      textarea {
        width: 100%;
        min-height: 140px;
        font-family: var(--mono);
        font-size: 14px;
        background: #0a0c12;
        color: var(--text);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.9rem 1rem;
        line-height: 1.55;
        resize: vertical;
        tab-size: 4;
      }
      textarea:focus {
        outline: none;
        border-color: var(--accent2);
        box-shadow: 0 0 0 3px rgba(75, 139, 190, 0.25);
      }
      button.run {
        background: linear-gradient(135deg, var(--accent2), #3a73a0);
        color: #fff;
        border: none;
        padding: 0.65rem 1.3rem;
        border-radius: 9px;
        cursor: pointer;
        margin-top: 0.8rem;
        font-weight: 600;
        font-size: 0.92rem;
        box-shadow: 0 3px 10px rgba(75, 139, 190, 0.3);
      }
      button.run:disabled {
        opacity: 0.4;
        cursor: default;
      }
      pre.ausgabe {
        background: #0a0c12;
        border: 1px solid var(--border);
        padding: 0.8rem 1rem;
        border-radius: 10px;
        white-space: pre-wrap;
        font-family: var(--mono);
        font-size: 13.5px;
        margin: 0.7rem 0 0;
        min-height: 2.5rem;
      }
      pre.ausgabe.fehler {
        color: var(--err);
      }
      pre.ausgabe:empty {
        display: none;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>
        <span class="dot1">&lt;</span>Django Unchained<span class="dot2"
          >&gt;</span
        >
      </h1>
      <p id="status">Python wird geladen …</p>
      <div class="fortschritt">
        <div class="balken-bg"><div id="balken"></div></div>
        <span id="zaehler">0 von 0 gelöst</span>
      </div>
    </header>
    <div id="aufgaben"></div>

    <script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
    <script>
      const aufgabenEl = document.getElementById("aufgaben");
      const statusEl = document.getElementById("status");
      const balkenEl = document.getElementById("balken");
      const zaehlerEl = document.getElementById("zaehler");
      let py = null;
      let gelöst = new Set();
      let gesamt = 0;

      function aktualisiereFortschritt() {
        balkenEl.style.width = gesamt
          ? (gelöst.size / gesamt) * 100 + "%"
          : "0%";
        zaehlerEl.textContent = gelöst.size + " von " + gesamt + " gelöst";
      }

      async function ladePython() {
        py = await loadPyodide();
        statusEl.textContent = "Python bereit. Wähl eine Aufgabe.";
      }

      async function laufen(code, ausgabeEl, karte) {
        ausgabeEl.classList.remove("fehler");
        ausgabeEl.textContent = "";
        try {
          py.runPython(
            `import sys, io\nsys.stdout = io.StringIO()\nsys.stderr = sys.stdout`,
          );
          py.runPython(code);
          ausgabeEl.textContent =
            py.runPython("sys.stdout.getvalue()") || "(keine Ausgabe)";
          karte.classList.add("geloest");
          gelöst.add(karte.dataset.id);
          aktualisiereFortschritt();
        } catch (err) {
          ausgabeEl.classList.add("fehler");
          ausgabeEl.textContent = String(err).split("\n").slice(-3).join("\n");
        } finally {
          py.runPython(
            "sys.stdout = sys.__stdout__; sys.stderr = sys.__stderr__",
          );
        }
      }

      function baueKarte(item, nummer) {
        const karte = document.createElement("section");
        karte.className = "aufgabe";
        karte.dataset.id = item.id;

        const kopf = document.createElement("div");
        kopf.className = "kopf";
        kopf.innerHTML =
          '<span class="badge"></span><h2></h2><span class="stufe"></span><span class="haken">✓</span>';
        kopf.querySelector(".badge").textContent = nummer;
        kopf.querySelector("h2").textContent = item.title;
        kopf.querySelector(".stufe").textContent = item.difficulty;
        kopf.addEventListener("click", () => karte.classList.toggle("offen"));

        const inhalt = document.createElement("div");
        inhalt.className = "inhalt";
        const erklaerung = document.createElement("div");
        erklaerung.className = "erklaerung";
        erklaerung.textContent = item.description;
        const code = document.createElement("textarea");
        code.placeholder = "Dein Python-Code …";
        const ausfuehren = document.createElement("button");
        ausfuehren.className = "run";
        ausfuehren.textContent = "Ausführen";
        const ausgabe = document.createElement("pre");
        ausgabe.className = "ausgabe";

        ausfuehren.addEventListener("click", () =>
          laufen(code.value, ausgabe, karte),
        );

        inhalt.append(erklaerung, code, ausfuehren, ausgabe);
        karte.append(kopf, inhalt);
        return karte;
      }

      function render(list) {
        let aktuell = "";
        let nummer = 0;
        list.forEach((item) => {
          if (item.section !== aktuell) {
            aktuell = item.section;
            const k = document.createElement("div");
            k.className = "kapitel";
            k.textContent = aktuell;
            aufgabenEl.appendChild(k);
          }
          nummer++;
          aufgabenEl.appendChild(baueKarte(item, nummer));
        });
        gesamt = list.length;
        aktualisiereFortschritt();
      }

      fetch("/api/challenges/")
        .then((r) => {
          if (!r.ok) throw new Error(r.status);
          return r.json();
        })
        .then(render)
        .catch(() => {
          statusEl.textContent = "Die API antwortet nicht. Läuft der Server?";
        });

      loadPyodide()
        .then((p) => {
          py = p;
          statusEl.textContent = "Python bereit. Wähl eine Aufgabe.";
        })
        .catch(() => {
          statusEl.textContent = "Python konnte nicht geladen werden.";
        });
    </script>
  </body>
</html>
