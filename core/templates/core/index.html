{% load static %}
<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Django Unchained – Code not Chains</title>
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}" />
  </head>
  <body>
    <header class="top">
      <h1><span class="t1">DJANGO</span><span class="t2">UNCHAINED</span></h1>
      <p class="tagline">Mein Code. Meine Regeln. Keine Ketten.</p>
      <div class="hud">
        <span id="rank" class="rank">Greenhorn</span>
        <span id="xp" class="xp">0 XP</span>
        <div class="barwrap" title="Fortschritt">
          <div id="bar" class="bar"></div>
        </div>
      </div>
    </header>

    <main>
      <section id="map-wrap">
        <h2 class="sect">Wähle deine Mission</h2>
        <div id="map" class="map"></div>
      </section>
      <section id="stage" hidden></section>
    </main>

    <footer>
      <span>CODE NOT CHAINS</span>
      <button id="reset" class="ghost" type="button">
        Fortschritt zurücksetzen
      </button>
    </footer>

    <aside id="cowboy" class="cowboy" aria-live="polite">
      <div id="bubble" class="bubble"><p id="bubble-text"></p></div>
      <img
        id="avatar"
        class="avatar"
        src="{% static 'core/img/cowboy.png' %}"
        alt="Der Cowboy – klick mich für einen Tipp"
        title="Klick mich für einen Tipp"
      />
    </aside>

    {% csrf_token %}
    <script src="{% static 'core/js/app.js' %}"></script>
  </body>
</html>
